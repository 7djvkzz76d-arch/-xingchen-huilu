<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="description" content="星屑回路：原创三消益智挑战，三关制，第3关为终极难度。">
<link rel="manifest" href="manifest.webmanifest">
<title>星屑回路</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#050b15;color:#e8f3ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100dvh;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
button{font:inherit;color:#eef7ff}
.app{width:min(100%,520px);min-height:100dvh;margin:auto;padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.top{display:flex;justify-content:space-between;align-items:center;min-height:34px}
.brand{font-weight:900;font-size:20px;letter-spacing:.2px}.brand i{color:#60a5fa;font-style:normal}
.stats{font-size:13px;color:#a9bdd5}.stats b{font-size:16px;color:#e8f3ff}
.board{background:#0b1728;border:1px solid #263c58;border-radius:20px;padding:10px;box-shadow:0 12px 36px #0005}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#9fb3cc;padding:1px 2px}
.bar b{color:#dcecff}
.field{position:relative;height:clamp(330px,46dvh,500px);margin:8px 0 10px;border-radius:18px;background:radial-gradient(circle at 50% 35%,#193253,#08111f);overflow:hidden;border:1px solid #132941;box-shadow:inset 0 0 50px #020811}
.field:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 0 42%,#7dd3fc08 50%,transparent 58%)}
.tile{position:absolute;touch-action:manipulation;user-select:none;-webkit-user-select:none;left:var(--x);top:var(--y);transform:translate(calc(-50% + var(--lift)),calc(-50% + var(--lift)));width:clamp(64px,18vw,82px);height:clamp(64px,18vw,82px);border-radius:20px;border:1px solid #4b7194;background:linear-gradient(145deg,#2d4f70,#13263c);color:#eef7ff;font-size:clamp(28px,7vw,36px);box-shadow:0 10px 22px #0009,0 0 0 5px #0d1e31aa;cursor:pointer;z-index:2}
.tile:active{transform:translate(calc(-50% + var(--lift)),calc(-50% + var(--lift))) scale(.95)}
.tile.locked{opacity:.38;filter:saturate(.55);cursor:default}
.tile.gone{opacity:0;pointer-events:none}
.hand{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.hand span{height:50px;border-radius:11px;border:1px dashed #304761;background:#0f1d30;display:grid;place-items:center;font-size:22px}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:8px}
.actions button{min-height:50px;padding:8px 6px;border-radius:14px;background:#16283e;border:1px solid #35516e;font-weight:800;touch-action:manipulation}
.actions .primary{background:#1976d2}
button:focus-visible{outline:2px solid #7dd3fc;outline-offset:2px}
button:active{transform:scale(.98)}
dialog{border:1px solid #35516e;border-radius:18px;background:#122238;color:#eef7ff;max-width:88%;text-align:center}
dialog::backdrop{background:#000b}
dialog p{white-space:pre-line;font-size:18px;font-weight:850;line-height:1.5;margin:10px 0 14px}
dialog button{min-height:48px;padding:8px 18px;border:1px solid #4a7198;border-radius:12px;background:#1976d2;font-weight:800}
dialog.finish{border-color:#60a5fa;box-shadow:0 18px 60px #0009}
dialog.finish::before{content:"✦ 终极回路 · 通关成功 ✦";display:block;font-size:13px;letter-spacing:1px;color:#7dd3fc;font-weight:900;margin:2px 0 8px}
.foot{text-align:center;color:#667d98;font-size:9px;padding-bottom:2px}
@media(max-width:390px){
  .app{padding-left:10px;padding-right:10px}
  .board{padding:9px}
  .field{height:clamp(310px,44dvh,440px)}
  .tile{border-radius:18px}
  .hand span{height:46px;font-size:20px}
  .actions{gap:5px}.actions button{min-height:48px;font-size:14px}
}
@media(min-width:500px){.tile{width:82px;height:82px}}
</style>
</head>
<body>
<main class="app">
<header class="top">
  <div class="brand">✦ 星屑<i>回路</i></div>
  <div class="stats">分数 <b id="score">0</b></div>
</header>
<section class="board">
  <div class="bar"><span>回路 <b id="level">1</b>/3</span><b id="diff">入门</b></div>
  <div id="field" class="field" aria-label="星屑回路棋盘"></div>
  <div class="bar"><span>能量槽 · 三颗同星坍缩</span><span id="hint">可点击发光星块</span></div>
  <div id="slots" class="hand" aria-label="能量槽"></div>
  <div class="actions">
    <button id="share" type="button" aria-label="分享战绩">↗ 分享战绩</button>
    <button id="undo" type="button" aria-label="撤回上一步">↩ 撤回</button>
    <button id="restart" class="primary" type="button" aria-label="重新开始当前关卡">↻ 重开</button>
  </div>
</section>
<div class="foot">原创三消益智玩法 · 第3关为极限难度目标</div>
</main>
<dialog id="modal" aria-labelledby="msg"><p id="msg"></p><button id="close" type="button">继续</button></dialog>
<script src="game.js"></script>
</body>
</html>
