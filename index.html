<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>星屑回路</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#050b15;color:#e8f3ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100dvh}.app{width:min(100%,520px);min-height:100dvh;margin:auto;padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:20px}.brand i{color:#60a5fa;font-style:normal}.stats{font-size:12px;color:#a9bdd5}.board{flex:1;display:flex;flex-direction:column;min-height:0;background:#0b1728;border:1px solid #263c58;border-radius:20px;padding:10px}.bar{display:flex;justify-content:space-between;font-size:12px;color:#9fb3cc}.field{position:relative;flex:1;min-height:310px;margin:8px 0;border-radius:16px;background:radial-gradient(circle at 50% 35%,#193253,#08111f);overflow:hidden}.tile{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);width:58px;height:58px;border-radius:16px;border:1px solid #41617f;background:linear-gradient(145deg,#274666,#13263c);color:#eef7ff;font-size:27px;box-shadow:0 8px 18px #0008}.tile.gone{opacity:0;pointer-events:none}.tile:disabled{opacity:.12;pointer-events:none}.hand{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.hand span{height:48px;border-radius:10px;border:1px dashed #304761;background:#0f1d30;display:grid;place-items:center;font-size:21px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:7px}button{font:inherit;color:#eef7ff;background:#16283e;border:1px solid #35516e;border-radius:12px;padding:10px;min-height:42px;font-weight:750}button:active{transform:scale(.98)}dialog{border:1px solid #35516e;border-radius:18px;background:#122238;color:#eef7ff;max-width:90%;text-align:center}dialog::backdrop{background:#000b}dialog p{white-space:pre-line;font-size:18px;font-weight:850;line-height:1.5;margin:10px 0 14px}dialog.finish{border-color:#60a5fa}.primary{background:#1976d2}.foot{text-align:center;color:#667d98;font-size:9px}@media(max-width:390px){.field{min-height:250px}.tile{width:50px;height:50px;font-size:23px}.hand span{height:43px;font-size:19px}.actions button{min-height:38px;padding:8px}}
</style></head><body><main class="app"><header class="top"><div class="brand">✦ 星屑<i>回路</i></div><div class="stats">分数 <b id="score">0</b></div></header><section class="board"><div class="bar"><span>回路 <b id="level">1</b>/3</span><b id="diff">入门</b></div><div id="field" class="field"></div><div class="bar"><span>能量槽 · 三颗同星坍缩</span></div><div id="slots" class="hand"></div><div class="actions"><button id="undo">↩ 撤回</button><button id="restart" class="primary">↻ 重开</button></div></section><div class="foot">原创三消益智玩法 · 第3关为极限难度目标</div></main><dialog id="modal"><p id="msg"></p><button id="close">继续</button></dialog><script src="game.js"></script></body></html>
