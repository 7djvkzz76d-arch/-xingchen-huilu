<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="星屑回路玩法说明：三层星块、7格能量槽、三颗同星坍缩。"><title>玩法说明｜星屑回路</title><style>body{margin:0;background:#050b15;color:#e8f3ff;font:16px/1.8 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:760px;margin:auto;padding:28px 20px}a{color:#7dd3fc}h1{font-size:28px}section{background:#0b1728;border:1px solid #263c58;border-radius:18px;padding:20px;margin:16px 0}</style></head><body><main><a href="./">← 回到游戏</a><h1>星屑回路 · 玩法说明</h1><section><h2>目标</h2><p>从三层星块中选择当前可见的星块，把相同图案送入7格能量槽。当同一种星块达到三颗时，它们会坍缩并获得分数。</p><h2>策略</h2><p>先观察上层与下层的关系。选择错误的顺序可能让7格能量槽被占满；撤回按钮可以帮助你重新规划。</p><h2>关卡</h2><p>游戏共有3个原创回路：入门、深思、☄️ 1% 极限。第3关是难度目标，不代表实际1%通关率。</p></section><section><h2>为什么免费</h2><p>这是一个轻量、无需注册即可玩的原创网页游戏。项目通过游戏平台和合规广告渠道探索收入，用于继续开发新关卡与维护服务。</p></section><p><a href="privacy.html">隐私政策</a> · <a href="terms.html">使用条款</a></p></main></body></html>
